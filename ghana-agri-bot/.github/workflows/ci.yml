name: AgriBOT CI

on:
  push:
    branches: [ adamstemp ]
  pull_request:
    branches: [ adamstemp ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Google credentials
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
          echo "$GOOGLE_CREDENTIALS_JSON" > google-credentials.json
        fi

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ scripts/

    - name: Run basic tests
      run: |
        # Example: run a script that should not fail
        python scripts/test_orchestrator.py || true
        python scripts/test_satellite.py || true

    - name: Dry run bot startup
      run: |
        python -c "import src.bot" || true

    - name: Run tests with coverage
      run: |
        pip install coverage
        coverage run -m pytest
        coverage report
        coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Archive logs and feedback (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: feedback-and-logs
        path: |
          data/feedback/
          data/logs/