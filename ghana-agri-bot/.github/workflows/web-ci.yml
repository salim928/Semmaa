name: Web Landing CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'agribot-landing/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'agribot-landing/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: agribot-landing/package-lock.json
    
    - name: Install dependencies
      working-directory: ./agribot-landing
      run: npm ci
    
    - name: Run ESLint
      working-directory: ./agribot-landing
      run: npm run lint
    
    - name: TypeScript check
      working-directory: ./agribot-landing
      run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: agribot-landing/package-lock.json
    
    - name: Install dependencies
      working-directory: ./agribot-landing
      run: npm ci
    
    - name: Run tests
      working-directory: ./agribot-landing
      run: npm test || echo "No tests configured yet"

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: agribot-landing/package-lock.json
    
    - name: Install dependencies
      working-directory: ./agribot-landing
      run: npm ci
    
    - name: Build Next.js app
      working-directory: ./agribot-landing
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://api.example.com
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nextjs-build
        path: agribot-landing/.next/

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: agribot-landing/package-lock.json
    
    - name: Install dependencies
      working-directory: ./agribot-landing
      run: npm ci
    
    - name: Build and serve
      working-directory: ./agribot-landing
      run: |
        npm run build
        npm install -g serve
        serve -l 3000 -s out &
        sleep 5
    
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:3000
        uploadArtifacts: true
        temporaryPublicStorage: true
